[package]
name = "badeel"
version = "0.1.3"
edition = "2024"
authors = ["Ryan Athlawi", "Moayad Almutairi"]
description = "بديل — مبدّل حسابات: ستيم، باتل نت، إيبك، رايوت، يوبيسوفت، روكستار، جوج"
license = "GPL-3.0"
repository = "https://github.com/Ryanathlawi/badeel"

[dependencies]
eframe = { version = "=0.36.1", default-features = false, features = [
    "accesskit",
    "glow",
    "persistence",
] }
egui = "=0.36.1"
egui_extras = { version = "=0.36.1", features = ["image", "svg", "file"] }
image = { version = "0.25.10", features = ["png"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
anyhow = "1.0.103"
rfd = "0.17.2"
log = "0.4.32"
env_logger = { version = "0.11.8", default-features = false }
sysinfo = { version = "0.39.5", default-features = false, features = [
    "system",
] }
aes-gcm = "0.11.1"
getrandom = "0.3.4"
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
zeroize = { version = "1.9.0", features = ["derive"] }
discord-rich-presence = "1.1.0"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security_Cryptography",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }

[build-dependencies]
embed-resource = "3.0.11"
image = { version = "0.25.10", features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# نفس باتش دروبشيب: epaint 0.36.1 + UAX#9 لترتيب النص العربي
[patch.crates-io]
epaint = { path = "vendor/epaint" }
